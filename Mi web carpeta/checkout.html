<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Comprar aplicación</title>

<link rel="stylesheet" href="css/style.css">

<style>

.checkout{

max-width:1000px;

margin:40px auto;

display:grid;

grid-template-columns:1fr 1fr;

gap:30px;

padding:20px;

}

.producto{

background:white;

padding:20px;

border-radius:20px;

box-shadow:0 5px 20px rgba(0,0,0,.1);

}

.producto img{

width:100%;

height:300px;

object-fit:cover;

border-radius:15px;

}

.producto h2{

margin-top:20px;

}

.precio{

font-size:30px;

color:#0F9D58;

margin-top:15px;

font-weight:bold;

}

.pagos{

background:white;

padding:20px;

border-radius:20px;

box-shadow:0 5px 20px rgba(0,0,0,.1);

}

.metodo{

display:flex;

align-items:center;

justify-content:space-between;

padding:15px;

border:2px solid #ddd;

border-radius:15px;

margin-top:20px;

cursor:pointer;

transition:.3s;

}

.metodo:hover{

border-color:#0F9D58;

transform:scale(1.02);

}

.metodo img{

height:45px;

}

#comprarAhora{

width:100%;

margin-top:30px;

padding:18px;

border:none;

border-radius:50px;

background:#0F9D58;

color:white;

font-size:20px;

font-weight:bold;

}

@media(max-width:900px){

.checkout{

grid-template-columns:1fr;

}

}

</style>

</head>

<body>

<header>

<div class="logo">

<img src="imagenes/logo.png">

<h2>Mi Tienda</h2>

</div>

</header>

<section class="checkout">

<div class="producto">

<img src="imagenes/app1.jpg">

<h2>WhatsAuto Pro</h2>

<p>

Automatiza respuestas, envíos y mucho más.

</p>

<div class="precio">

Gs. 50.000

</div>

</div>

<div class="pagos">

<h2>Selecciona un método de pago</h2>

<div class="metodo">

<span>PayPal</span>

<img src="imagenes/paypal.png">

</div>

<div class="metodo">

<span>Mercado Pago</span>

<img src="imagenes/mercadopago.png">

</div>

<button id="comprarAhora">

Comprar ahora

</button>

</div>

</section>

<script>

let metodo="";

document.querySelectorAll(".metodo").forEach(item=>{

item.onclick=()=>{

document.querySelectorAll(".metodo").forEach(i=>{

i.style.border="2px solid #ddd";

});

item.style.border="3px solid #0F9D58";

metodo=item.innerText;

}

});

document.getElementById("comprarAhora").onclick=()=>{

if(metodo==""){

alert("Selecciona un método de pago.");

return;

}

alert("Has seleccionado: "+metodo+". En la siguiente parte conectaremos este botón con el sistema de pago real.");

}

</script>

</body>
</html>
